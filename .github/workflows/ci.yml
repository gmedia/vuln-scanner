name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip all test, lint, and typecheck jobs"
        type: boolean
        required: false
        default: false
      skip_build:
        description: "Skip Docker build and scan jobs"
        type: boolean
        required: false
        default: false
      skip_deploy:
        description: "Skip the deploy job"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 0 * * 0"  # Sunday midnight UTC — weekly security scan + dep audit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  API_KEY: e2e-test-api-key

jobs:
  python-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [backend, workers]
    env:
      SENTRY_DSN: ""
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.dir }}/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: python -m pytest tests/ -v --tb=short --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.dir }}
          path: ${{ matrix.dir }}/coverage.xml
          retention-days: 7

  frontend-typecheck:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit

  frontend-unit-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  frontend-build:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  python-lint:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [backend, workers]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check --output-format=github

  python-typecheck:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [backend, workers]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install mypy==1.13.0
      - name: Install runtime deps (for type stubs)
        run: pip install -r requirements.txt types-redis
      - name: Run mypy
        run: mypy --config-file=pyproject.toml .

  frontend-lint:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run eslint
        run: npm run lint

  e2e-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
    needs: [python-tests, frontend-typecheck, frontend-unit-tests, frontend-build, python-lint, python-typecheck, frontend-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Repo secrets (Settings → Secrets). Same values Playwright + seed must share.
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require E2E secrets
        run: |
          if [ -z "${E2E_PASSWORD:-}" ]; then
            echo "E2E_PASSWORD secret is empty. Add repository secrets E2E_EMAIL and E2E_PASSWORD." >&2
            exit 1
          fi
          if [ -z "${E2E_EMAIL:-}" ]; then
            echo "E2E_EMAIL empty — defaulting to e2e@vulnscan.dev for this job"
            echo "E2E_EMAIL=e2e@vulnscan.dev" >> "$GITHUB_ENV"
          fi

      - name: Create .env from example
        run: |
          cp .env.example .env
          # Override placeholder passwords with values that work for Docker Compose variable interpolation
          sed -i 's/REDIS_PASSWORD=<your-redis-password>/REDIS_PASSWORD=e2e-test-password/' .env
          sed -i 's/POSTGRES_PASSWORD=<your-postgres-password>/POSTGRES_PASSWORD=e2e-test-password/' .env
          sed -i 's|DATABASE_URL=postgresql+asyncpg://vuln_scanner:<your-postgres-password>@postgres:5432/vuln_scanner|DATABASE_URL=postgresql+asyncpg://vuln_scanner:e2e-test-password@postgres:5432/vuln_scanner|' .env
          sed -i 's|DATABASE_URL_SYNC=postgresql://vuln_scanner:<your-postgres-password>@postgres:5432/vuln_scanner|DATABASE_URL_SYNC=postgresql://vuln_scanner:e2e-test-password@postgres:5432/vuln_scanner|' .env
          sed -i 's/API_KEY=<your-api-key-here>/API_KEY=e2e-test-api-key/' .env
          sed -i 's/SECRET_KEY=<your-secret-key-here>/SECRET_KEY=e2e-secret-key/' .env
          sed -i 's/JWT_SECRET=<your-jwt-secret-here>/JWT_SECRET=e2e-jwt-secret/' .env

      - name: Install frontend dependencies (pre-Docker — avoid root-owned node_modules)
        run: npm ci
        working-directory: frontend

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright OS deps
        timeout-minutes: 3
        continue-on-error: true
        working-directory: frontend
        run: sudo npx playwright install-deps chromium

      - name: Install Playwright Chromium
        timeout-minutes: 8
        working-directory: frontend
        run: |
          set -euo pipefail
          # Bound each download so a hung CDN cannot eat the whole step timeout.
          for attempt in 1 2 3; do
            echo "Playwright chromium download attempt ${attempt}"
            if timeout 120 npx playwright install chromium; then
              exit 0
            fi
            echo "Playwright chromium download failed (attempt ${attempt})"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Start full stack via Docker Compose
        run: docker compose -f docker-compose.yml up -d --wait

      - name: Seed E2E test data
        run: |
          docker compose -f docker-compose.yml exec -T \
            -e E2E_EMAIL \
            -e E2E_PASSWORD \
            backend python -m scripts.seed_e2e

      - name: Warm up Vite dev server (all routes)
        run: |
          echo "Warming up Vite dev server..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173) || true
            echo "  Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "  Vite ready after $i attempt(s)"
              break
            fi
            sleep 3
          done
          # Pre-compile all routes E2E tests visit (Vite on-demand = cold start per route)
          for route in /login /register /dashboard /scan/ip /scan/domain /scan/mobile; do
            echo "  Warming route: $route"
            curl -s -o /dev/null -w "  → HTTP %{http_code}\n" "http://localhost:5173$route" || true
          done

      - name: Run Playwright E2E tests
        run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
          BASE_URL: "http://localhost:5173"
          API_KEY: "e2e-test-api-key"
          E2E_EMAIL: ${{ env.E2E_EMAIL }}
          E2E_PASSWORD: ${{ env.E2E_PASSWORD }}

      - name: Upload Playwright HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results / traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Dump service logs (on failure)
        if: failure()
        run: |
          docker compose -f docker-compose.yml logs backend --tail=100
          docker compose -f docker-compose.yml logs frontend --tail=50
          docker compose -f docker-compose.yml logs postgres --tail=30
          docker compose -f docker-compose.yml logs worker_ip --tail=30
          docker compose -f docker-compose.yml logs worker_domain --tail=30
          docker compose -f docker-compose.yml logs celery_beat --tail=30

  docker-scan:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_build }}
    needs: []
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [backend, workers, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.dir }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir == 'workers' && '.' || matrix.dir }}
          file: ${{ matrix.dir == 'workers' && 'workers/Dockerfile' || format('{0}/Dockerfile', matrix.dir) }}
          load: true
          tags: vuln-scanner-${{ matrix.dir }}:${{ github.sha }}
          cache-from: type=gha,scope=buildkit-${{ matrix.dir }}
          cache-to: type=gha,scope=buildkit-${{ matrix.dir }},mode=max

      - name: Scan ${{ matrix.dir }} image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: vuln-scanner-${{ matrix.dir }}:${{ github.sha }}
          format: sarif
          output: trivy-results-${{ matrix.dir }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results-${{ matrix.dir }}.sarif
          category: trivy-${{ matrix.dir }}

  deploy:
    if: ${{ (github.event_name == 'push' && github.ref_name == 'main') && (github.event_name != 'workflow_dispatch' || !inputs.skip_deploy) }}
    needs: [python-tests, frontend-typecheck, frontend-unit-tests, frontend-build, python-lint, python-typecheck, frontend-lint, e2e-tests]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Write .env on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # Jump via bastion (coding host): app host UFW allows SSH only from bastion.
          proxy_host: ${{ secrets.DEPLOY_JUMP_HOST }}
          proxy_username: ${{ secrets.DEPLOY_JUMP_USER }}
          proxy_key: ${{ secrets.DEPLOY_JUMP_SSH_KEY }}
          proxy_port: ${{ secrets.DEPLOY_JUMP_PORT || 22 }}
          proxy_timeout: 60s
          command_timeout: 30m
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            REDIS_URL="${{ secrets.REDIS_URL }}"
            CELERY_BROKER_URL="${{ secrets.CELERY_BROKER_URL }}"
            CELERY_RESULT_BACKEND="${{ secrets.CELERY_RESULT_BACKEND }}"
            # Extract password from REDIS_URL (format: redis://:PASSWORD@host:port/db or redis://user:PASSWORD@host:port/db)
            REDIS_PASSWORD=$(echo "$REDIS_URL" | sed -n 's|.*://[^:]*:\([^@]*\)@.*|\1|p')
            # If REDIS_URL has no embedded password (e.g. redis://host:port/db),
            # generate one and inject it into all Redis connection URLs so apps can still connect.
            if [ -z "$REDIS_PASSWORD" ]; then
              REDIS_PASSWORD=$(openssl rand -hex 16)
              REDIS_URL=$(echo "$REDIS_URL" | sed "s|redis://|redis://:${REDIS_PASSWORD}@|")
              CELERY_BROKER_URL=$(echo "$CELERY_BROKER_URL" | sed "s|redis://|redis://:${REDIS_PASSWORD}@|")
              CELERY_RESULT_BACKEND=$(echo "$CELERY_RESULT_BACKEND" | sed "s|redis://|redis://:${REDIS_PASSWORD}@|")
            fi

            # POSTGRES_HOST: Docker service name for single-host, or data-host for multi-host.
            # REDIS_URL / CELERY_* should already target the same data plane.
            cat > .env << ENVEOF
            DATABASE_URL=postgresql+asyncpg://${{ secrets.POSTGRES_USER || 'vuln_scanner' }}:${{ secrets.POSTGRES_PASSWORD }}@${{ secrets.POSTGRES_HOST || 'postgres' }}:5432/${{ secrets.POSTGRES_DB || 'vuln_scanner' }}
            DATABASE_URL_SYNC=postgresql://${{ secrets.POSTGRES_USER || 'vuln_scanner' }}:${{ secrets.POSTGRES_PASSWORD }}@${{ secrets.POSTGRES_HOST || 'postgres' }}:5432/${{ secrets.POSTGRES_DB || 'vuln_scanner' }}
            REDIS_URL=${REDIS_URL}
            CELERY_BROKER_URL=${CELERY_BROKER_URL}
            CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
            POSTGRES_USER=${{ secrets.POSTGRES_USER || 'vuln_scanner' }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB || 'vuln_scanner' }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            REDIS_PASSWORD=${REDIS_PASSWORD}
            API_KEY=${{ secrets.API_KEY }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            REMOTE_DATA=${{ secrets.REMOTE_DATA }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM="${{ secrets.SMTP_FROM }}"
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            E2E_EMAIL=${{ secrets.E2E_EMAIL }}
            E2E_PASSWORD=${{ secrets.E2E_PASSWORD }}
            DEFAULT_REGISTER_CREDITS=${{ secrets.DEFAULT_REGISTER_CREDITS }}
            IP_SCAN_CREDIT_COST=${{ secrets.IP_SCAN_CREDIT_COST }}
            DOMAIN_SCAN_CREDIT_COST=${{ secrets.DOMAIN_SCAN_CREDIT_COST }}
            APK_SCAN_CREDIT_COST=${{ secrets.APK_SCAN_CREDIT_COST }}
            IPA_SCAN_CREDIT_COST=${{ secrets.IPA_SCAN_CREDIT_COST }}
            NVD_API_KEY=${{ secrets.NVD_API_KEY }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            COOKIE_SECURE=${{ secrets.COOKIE_SECURE || 'true' }}
            GUARD_ENABLED=${{ secrets.GUARD_ENABLED || 'true' }}
            GUARD_MOCK_WAZUH=${{ secrets.GUARD_MOCK_WAZUH || 'true' }}
            GUARD_ALERT_MIN_LEVEL=${{ secrets.GUARD_ALERT_MIN_LEVEL || '12' }}
            GUARD_ENROLL_TOKEN_TTL_HOURS=${{ secrets.GUARD_ENROLL_TOKEN_TTL_HOURS || '24' }}
            WAZUH_VERIFY_TLS=${{ secrets.WAZUH_VERIFY_TLS || 'true' }}
            SIEM_ENABLED=${{ secrets.SIEM_ENABLED || 'false' }}
            SIEM_SEARCH_MIN_LEVEL=${{ secrets.SIEM_SEARCH_MIN_LEVEL || '7' }}
            SIEM_MAX_LOOKBACK_HOURS=${{ secrets.SIEM_MAX_LOOKBACK_HOURS || '168' }}
            SIEM_INCLUDE_FULL_LOG=${{ secrets.SIEM_INCLUDE_FULL_LOG || 'false' }}
            SIEM_MAX_PAGE_SIZE=${{ secrets.SIEM_MAX_PAGE_SIZE || '50' }}
            OBJECT_STORAGE_BACKEND=${{ secrets.OBJECT_STORAGE_BACKEND || 'local' }}
            COS_SECRET_ID=${{ secrets.COS_SECRET_ID }}
            COS_SECRET_KEY=${{ secrets.COS_SECRET_KEY }}
            COS_REGION=${{ secrets.COS_REGION }}
            COS_BUCKET=${{ secrets.COS_BUCKET }}
            COS_APP_ID=${{ secrets.COS_APP_ID }}
            COS_ENDPOINT=${{ secrets.COS_ENDPOINT }}
            COS_PREFIX=${{ secrets.COS_PREFIX || 'scans/' }}
            ENVEOF
            # Do not write empty WAZUH_* — blank secrets would wipe host lab URLs/creds on every deploy.
            append_if_set() {
              local key="$1"
              local val="$2"
              if [ -n "$val" ]; then
                printf '%s=%s\n' "$key" "$val" >> .env
              fi
            }
            append_if_set WAZUH_MANAGER_URL "${{ secrets.WAZUH_MANAGER_URL }}"
            append_if_set WAZUH_MANAGER_USER "${{ secrets.WAZUH_MANAGER_USER }}"
            append_if_set WAZUH_MANAGER_PASSWORD "${{ secrets.WAZUH_MANAGER_PASSWORD }}"
            append_if_set WAZUH_INDEXER_URL "${{ secrets.WAZUH_INDEXER_URL }}"
            append_if_set WAZUH_INDEXER_USER "${{ secrets.WAZUH_INDEXER_USER }}"
            append_if_set WAZUH_INDEXER_PASSWORD "${{ secrets.WAZUH_INDEXER_PASSWORD }}"
            append_if_set WAZUH_AGENT_MANAGER_HOST "${{ secrets.WAZUH_AGENT_MANAGER_HOST }}"
            echo ".env written from GitHub Secrets"
            chmod 600 .env

      - name: Deploy to production
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_JUMP_SSH_KEY }}" > ~/.ssh/jump_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/jump_key
          JUMP_HOST="${{ secrets.DEPLOY_JUMP_HOST }}"
          JUMP_USER="${{ secrets.DEPLOY_JUMP_USER }}"
          JUMP_PORT="${{ secrets.DEPLOY_JUMP_PORT || 22 }}"
          DEPLOY_HOST="${{ secrets.DEPLOY_HOST }}"
          DEPLOY_USER="${{ secrets.DEPLOY_USER }}"
          DEPLOY_PORT="${{ secrets.DEPLOY_PORT || 22 }}"
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          # Tunnel through bastion: runner never needs direct SSH to app host.
          PROXY_CMD="ssh -i $HOME/.ssh/jump_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p ${JUMP_PORT} -W %h:%p ${JUMP_USER}@${JUMP_HOST}"
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o "ProxyCommand=${PROXY_CMD}" \
            -P "${DEPLOY_PORT}" \
            scripts/deploy.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/deploy-vuln.sh"
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o "ProxyCommand=${PROXY_CMD}" \
            -p "${DEPLOY_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash /tmp/deploy-vuln.sh ${DEPLOY_PATH} 2>&1 | tee /tmp/deploy-vuln.log; EXIT=\${PIPESTATUS[0]}; if [ \$EXIT -ne 0 ]; then echo '=== Full deploy log ==='; cat /tmp/deploy-vuln.log; fi; exit \$EXIT"
          rm -f ~/.ssh/deploy_key ~/.ssh/jump_key
