name: Prod drift

# Detects the failure mode that went unnoticed for ~50 hours: `main` is green
# and merging, but the deploy job has been failing, so production is stale.
#
# Requires GET /api/health to report `sha` (shipped with the GIT_SHA change).
# Until that deploy lands, this job fails with an explicit "unknown" message —
# which is the correct signal, not a false alarm.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-drift
  cancel-in-progress: true

jobs:
  drift:
    name: Compare deployed SHA with main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare
        env:
          BASE_URL: ${{ vars.PROD_BASE_URL || 'https://sinexis.app' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          main_sha=$(
            curl -fsS --max-time 15 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
              | jq -r '.sha'
          )

          health=$(
            curl -fsS --max-time 15 "${BASE_URL%/}/api/health" || {
              echo "::error::Production health endpoint did not respond (${BASE_URL%/}/api/health)."
              exit 1
            }
          )
          deployed_sha=$(printf '%s' "$health" | jq -r '.sha // "unknown"')

          {
            echo "### Production drift"
            echo ""
            echo "| | SHA |"
            echo "|---|---|"
            echo "| main | \`${main_sha}\` |"
            echo "| deployed | \`${deployed_sha}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$deployed_sha" = "unknown" ]; then
            echo "::error::Production does not report a build SHA. The GIT_SHA deploy has not landed yet."
            exit 1
          fi

          if [ "$deployed_sha" != "$main_sha" ]; then
            # A push to main starts CI/CD -> deploy. While that run is queued
            # or in flight, production legitimately still reports the previous
            # SHA: that is a race, not drift. Skip, but only for a real run.
            runs_json=""
            runs_err=""
            if ! runs_json=$(
              curl -fsS --max-time 15 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=10" \
                2>&1
            ); then
              runs_err="$runs_json"
              runs_json=""
              echo "::notice::Could not query in-flight CI/CD runs (${runs_err}); falling back to the 20-minute commit grace window only."
            fi

            if [ -n "$runs_json" ]; then
              inflight=$(
                printf '%s' "$runs_json" | jq -r '
                  [.workflow_runs[]
                   | select(.name == "CI/CD")
                   | select(
                       .conclusion == null
                       or .status == "queued"
                       or .status == "in_progress"
                       or .status == "waiting"
                       or .status == "pending"
                       or .status == "requested"
                     )
                  ] | first
                  | if . == null then "" else "\(.id) \(.status) \(.head_sha // "")" end
                ' 2>/dev/null || true
              )
              if [ -n "$inflight" ]; then
                read -r inflight_id inflight_status inflight_sha <<< "$inflight" || true
                echo "::notice::deploy for main is still in progress; skipping drift check"
                {
                  echo ""
                  echo "| skip reason | detail |"
                  echo "|---|---|"
                  echo "| in-flight deploy | CI/CD run [\`${inflight_id}\`](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${inflight_id}) on \`main\` is \`${inflight_status}\` (\`${inflight_sha}\`) |"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi

            # Second safety net: even if the run lookup missed it (API blip,
            # pagination, manual dispatch), a commit younger than 20 minutes
            # has probably not finished deploying yet.
            commit_json=$(
              curl -fsS --max-time 15 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${main_sha}" 2>/dev/null || true
            )
            commit_date=""
            if [ -n "$commit_json" ]; then
              commit_date=$(printf '%s' "$commit_json" | jq -r '.commit.committer.date // empty' 2>/dev/null || true)
            fi

            if [ -n "$commit_date" ] && commit_epoch=$(date -u -d "$commit_date" +%s 2>/dev/null); then
              now_epoch=$(date -u +%s)
              age=$((now_epoch - commit_epoch))
              if [ "$age" -ge 0 ] && [ "$age" -lt 1200 ]; then
                echo "::notice::main commit ${main_sha} is only $((age / 60))m old; skipping drift check"
                {
                  echo ""
                  echo "| skip reason | detail |"
                  echo "|---|---|"
                  echo "| commit grace window | \`main\` commit \`${main_sha}\` is \`${age}\`s old (< 1200s), so its deploy may still be in flight |"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            else
              echo "::notice::Could not read the main commit date; skipping the commit-age grace and keeping the drift failure."
            fi

            echo "::error::Production is running ${deployed_sha}, but main is ${main_sha}. The deploy job is failing or has not run."
            exit 1
          fi

          echo "Production matches main (${main_sha})."
