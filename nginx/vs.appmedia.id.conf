# vs.appmedia.id — legacy host. Canonical product host is sinexis.app.
# Place at /etc/nginx/conf.d/vs.appmedia.id.conf if this vhost still has DNS.
# After editing: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name vs.appmedia.id;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://sinexis.app$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name vs.appmedia.id;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/vs.appmedia.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vs.appmedia.id/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/vs.appmedia.id/chain.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    access_log /var/log/nginx/vs.appmedia.id-access.log;
    error_log /var/log/nginx/vs.appmedia.id-error.log;

    location / {
        return 301 https://sinexis.app$request_uri;
    }
}
