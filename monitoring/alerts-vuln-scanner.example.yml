# Example Prometheus rules for VulnScanner auto-fail gauge on /metrics.
# Load via rule_files; route via Alertmanager.

groups:
  - name: vuln-scanner
    rules:
      - alert: VulnScannerAutoFailedJobs
        expr: sum(vuln_maintenance_auto_failed_jobs) > 0
        for: 5m
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "Stale scan jobs were auto-failed"
          description: >-
            vuln_maintenance_auto_failed_jobs is {{ $value }} (pending+running).
            Check celery beat logs, /health/queues auto_failed, and dead_letter depth.
      - alert: VulnScannerAiFxRateStale
        expr: vuln_ai_fx_rate_age_days > 2
        for: 1h
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "AI USD->IDR FX rate is stale"
          description: >-
            vuln_ai_fx_rate_age_days is {{ $value }}. ai_fx.refresh runs daily at
            01:10 UTC on the ip_scan worker. Check its logs and the worker env
            (DB / FX source credentials). The admin FX card offers a manual override
            (Refresh now or a manually entered rate) while the fetch is broken.
      - alert: VulnScannerAiBillingShortfall
        expr: vuln_ai_usage_shortfall_idr_24h > 0
        for: 15m
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "AI billing settled with an uncollected shortfall"
          description: >-
            vuln_ai_usage_shortfall_idr_24h is {{ $value }} IDR. A settle could not
            collect the full amount because the org wallet was exhausted. Inspect the
            wallet balance and the corresponding ai_usage_events.shortfall_idr rows.
      - alert: VulnScannerAiWalletLedgerDrift
        expr: vuln_ai_wallet_ledger_drift_idr > 0
        for: 30m
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "AI wallet balance no longer matches its ledger sum"
          description: >-
            vuln_ai_wallet_ledger_drift_idr is {{ $value }} IDR. A wallet balance no
            longer matches its ledger sum, which means a code path mutated the balance
            without a ledger row (or a manual DB edit). Inspect ai_wallets vs
            ai_wallet_ledger for the offending organization, and never "fix" it by
            editing only one side.
      - alert: VulnScannerAiStaleReservations
        expr: vuln_ai_stale_open_reservations > 0
        for: 15m
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "AI reservations are not being reaped"
          description: >-
            vuln_ai_stale_open_reservations is {{ $value }}. ai_reservations.reap
            runs every 5 minutes on the ip_scan queue and releases holds older than
            20 minutes. A sustained count means beat or its worker is not consuming,
            so customer funds stay locked. Check the beat schedule and worker logs,
            then run the task manually if needed.
      - alert: VulnScannerAiUpstreamAuthRejected
        expr: sum(rate(vuln_ai_upstream_attempts_total{reason="auth"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          service: vuln-scanner
        annotations:
          summary: "AI upstream rejected our credentials"
          description: >-
            sum(rate(vuln_ai_upstream_attempts_total{reason="auth"}[5m])) is
            {{ $value }}/s. At least one wholesale provider answered 401/403, so its
            API key is expired or revoked. Every request routed to it fails over to
            the next candidate and pays double COGS. Check the provider row in
            /admin/ai?tab=providers and rotate the credential.
      - alert: VulnScannerAiUpstreamFailedRequests
        expr: sum(rate(vuln_ai_upstream_attempts_total{outcome="failed"}[10m])) > 0
        for: 10m
        labels:
          severity: critical
          service: vuln-scanner
        annotations:
          summary: "AI requests are failing after every upstream candidate"
          description: >-
            sum(rate(vuln_ai_upstream_attempts_total{outcome="failed"}[10m])) is
            {{ $value }}/s. All candidates for a model failed, so customers received
            an upstream error and their hold was released. Check provider status in
            /admin/ai?tab=providers and the ai_upstream_attempt_failed log lines for
            the failing model and reason.
      - alert: VulnScannerAiUpstreamFailoverRate
        expr: >-
          sum(rate(vuln_ai_upstream_attempts_total{outcome=~"retried|failed"}[15m]))
          /
          sum(rate(vuln_ai_upstream_attempts_total[15m]))
          > 0.2
        for: 15m
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "More than 20% of AI upstream attempts need a retry"
          description: >-
            The retry share is {{ $value }} (0.2 = 20%). A primary provider is
            degraded but failover is hiding it from customers. Sustained retries cost
            duplicate COGS because the failed attempt may already have generated
            tokens. Inspect the `reason` label and the provider's status.
      - alert: VulnScannerAiUpstreamRejectedRequests
        expr: sum(rate(vuln_ai_upstream_attempts_total{outcome="rejected"}[30m])) > 0
        for: 30m
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "AI upstream rejected a request as invalid"
          description: >-
            sum(rate(vuln_ai_upstream_attempts_total{outcome="rejected"}[30m])) is
            {{ $value }}/s. The provider answered a non-retryable 4xx, which means the
            alias points at an upstream model id that does not accept this request
            (renamed or retired model, or an unsupported parameter). Failover does not
            retry these by design. Check the model's primary and fallback upstream ids.
      - alert: VulnScannerAiProviderNeverProbed
        expr: vuln_ai_providers_never_probed > 0
        for: 30m
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "An enabled AI provider has never produced a probe verdict"
          description: >-
            vuln_ai_providers_never_probed is {{ $value }}. The probe runs every five
            minutes, so half an hour means it cannot even build a request for these
            providers: an unreadable credential, a rotated encryption key, or a malformed
            base URL. Their status is frozen, and MIN(last_probed_at) ignores NULL, so the
            age gauge alone cannot see them. A provider an admin disabled on purpose is
            excluded. Check the provider row in /admin/ai?tab=providers and the
            ai_provider_probe_failed worker log line.
      - alert: VulnScannerAiUpstreamBreakerOpen
        expr: vuln_ai_upstream_breakers_open > 0
        for: 10m
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "An AI upstream circuit breaker is open"
          description: >-
            vuln_ai_upstream_breakers_open is {{ $value }}. The gateway is skipping
            a provider whose breaker opened on repeated failures. Failover hides a
            provider that is down, so a sustained value means one provider is carrying
            all traffic while customers never see the outage. Check the provider rows
            in /admin/ai?tab=providers and fix its credentials or upstream status.
      - alert: VulnScannerAiProvidersDegraded
        expr: vuln_ai_providers_degraded > 0
        for: 15m
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "AI providers are marked degraded"
          description: >-
            vuln_ai_providers_degraded is {{ $value }}. ai_providers.probe (or an
            admin) marked an enabled provider degraded. Degraded providers are
            deprioritised but still used, so live traffic can still route to them.
            Check the provider rows in /admin/ai?tab=providers, and remember that only
            an admin should ever set a provider disabled.
      - alert: VulnScannerAiProviderProbeStale
        expr: vuln_ai_providers_probe_age_seconds > 900
        for: 10m
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "The AI provider probe is not running"
          description: >-
            vuln_ai_providers_probe_age_seconds is {{ $value }}. ai_providers.probe
            runs every 5 minutes, so 15 minutes means at least three cycles were
            missed and no provider has been checked since. status is frozen, so the
            fleet looks healthy while nothing is being checked. First check that
            celery beat is running and that ai_providers.probe is routed to the
            ip_scan queue (compose task_routes), then read the worker logs.
      - alert: VulnScannerPaymentPendingStale
        expr: vuln_payment_pending_age_seconds > 1800
        for: 15m
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "A payment checkout has been pending past the reconciliation window"
          description: >-
            vuln_payment_pending_age_seconds is {{ $value }}. A checkout has been
            pending past the 24h expiry and the 10-minute reconciliation window,
            which means webhooks are being missed and nothing is resolving the
            attempt. Check the `payment.reconcile_attempts` beat and worker logs and
            the Midtrans dashboard status for the order.
      - alert: VulnScannerPaymentWebhookFailures
        expr: vuln_payment_failed_events_24h > 0
        for: 15m
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "Payment webhook events failed in the last 24h"
          description: >-
            vuln_payment_failed_events_24h is {{ $value }}. Failed webhook events
            never activate access. Check the backend logs for signature errors,
            amount mismatch, and unknown attempt; then confirm the transaction in
            the provider dashboard and reconcile it manually if the money landed.
      - alert: VulnScannerPaymentAmountMismatch
        expr: vuln_payment_amount_mismatches_24h > 0
        for: 5m
        labels:
          severity: critical
          service: vuln-scanner
        annotations:
          summary: "A provider amount did not match the invoice total"
          description: >-
            vuln_payment_amount_mismatches_24h is {{ $value }}. The provider amount
            did not match org_invoices.total_idr, so the invoice was NOT marked paid.
            Verify the checkout total against the invoice (post-promo, post-tax) and
            consider a refund if the customer was charged.
      - alert: VulnScannerPaymentDuplicateSettlement
        expr: vuln_payment_duplicate_settlements_24h > 0
        for: 5m
        labels:
          severity: critical
          service: vuln-scanner
        annotations:
          summary: "A second successful settlement hit an already-paid invoice"
          description: >-
            vuln_payment_duplicate_settlements_24h is {{ $value }}. A second
            successful settlement arrived for an invoice that was already paid.
            Access was not re-activated, so the customer has paid twice. Refund the
            duplicate manually; never issue another activation.
      - alert: VulnScannerPaymentRefunds
        expr: vuln_payment_refunds_24h > 0
        for: 5m
        labels:
          severity: critical
          service: vuln-scanner
        annotations:
          summary: "A refund or chargeback was recorded"
          description: >-
            vuln_payment_refunds_24h is {{ $value }}. A refund or chargeback was
            recorded on a payment attempt. Access is NOT revoked automatically.
            Confirm the refund or dispute with the provider, decide manually
            whether the organization keeps access, then refund the money if it has
            not already been returned.
      - alert: VulnScannerPaymentPendingBacklog
        expr: vuln_payment_pending_attempts > 20
        for: 30m
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "Payment attempts are piling up pending"
          description: >-
            vuln_payment_pending_attempts is {{ $value }}. A sustained backlog means
            checkouts are being created faster than expiry and reconciliation can
            clear them, or the expiry sweep has stopped. Check the
            `payment.reconcile_attempts` and expiry beat entries plus worker logs.
      - alert: VulnScannerPromoPendingApprovals
        expr: vuln_promo_pending_approvals > 0
        for: 1h
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "A promo code above the finance cap is waiting for approval"
          description: >-
            vuln_promo_pending_approvals is {{ $value }}. A code above the P9 finance
            cap is waiting for a second platform admin. It was created inactive, so the
            customer cannot use it until someone approves it in /admin/promo-codes.
      - alert: VulnScannerPromoDiscountBurn
        expr: >-
          vuln_promo_discount_idr_24h > 10000000
          or
          vuln_promo_discount_idr_30d > 50000000
        for: 1h
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "Promo discount burn crossed the current threshold"
          description: >-
            vuln_promo_discount_idr_24h is {{ $value }} over the 24h/30d threshold.
            The thresholds (10,000,000 IDR/day, 50,000,000 IDR/30d) are provisional;
            finance should tune them. Discount is gross-to-net leakage, so compare it
            with invoice volume before assuming the amount is intentional.
      - alert: VulnScannerPromoRedemptionSpike
        expr: vuln_promo_redemptions_24h > 50
        for: 1h
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "Promo redemptions spiked in the last 24h"
          description: >-
            vuln_promo_redemptions_24h is {{ $value }}. This is usually a leaked code
            or a runaway campaign, not organic demand. Open /admin/promo-codes, sort by
            redemptions, and deactivate the offending code.
