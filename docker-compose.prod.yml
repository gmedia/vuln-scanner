# Production docker-compose — no nginx container (host nginx handles SSL + reverse proxy).
# Host nginx (nginx/sinexis.app.conf) proxies to 127.0.0.1:5174 (frontend) and :8000 (backend).

services:
  postgres:
    image: postgres:16-alpine
    container_name: vuln-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vuln_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-vuln_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vuln-net

  redis:
    image: redis:8-alpine
    container_name: vuln-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    # read_only removed — Redis 8 requires writable filesystem for appendonlydir
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vuln-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vuln-backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=768M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      API_KEY: ${API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      OSV_BASE_URL: ${OSV_BASE_URL:-https://api.osv.dev/v1}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-30}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Sinexis <noreply@sinexis.app>}
      FRONTEND_URL: ${FRONTEND_URL:-https://sinexis.app}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://sinexis.app}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      E2E_EMAIL: ${E2E_EMAIL:-}
      E2E_PASSWORD: ${E2E_PASSWORD:-}
      DEFAULT_REGISTER_CREDITS: ${DEFAULT_REGISTER_CREDITS:-30}
      IP_SCAN_CREDIT_COST: ${IP_SCAN_CREDIT_COST:-1}
      DOMAIN_SCAN_CREDIT_COST: ${DOMAIN_SCAN_CREDIT_COST:-2}
      APK_SCAN_CREDIT_COST: ${APK_SCAN_CREDIT_COST:-3}
      IPA_SCAN_CREDIT_COST: ${IPA_SCAN_CREDIT_COST:-3}
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-local}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_APP_ID: ${COS_APP_ID:-}
      COS_ENDPOINT: ${COS_ENDPOINT:-}
      COS_PREFIX: ${COS_PREFIX:-scans/}
      COS_TIMEOUT_SEC: ${COS_TIMEOUT_SEC:-600}
      GUARD_ENABLED: ${GUARD_ENABLED:-true}
      GUARD_MOCK_WAZUH: ${GUARD_MOCK_WAZUH:-true}
      GUARD_ALERT_MIN_LEVEL: ${GUARD_ALERT_MIN_LEVEL:-12}
      GUARD_ENROLL_TOKEN_TTL_HOURS: ${GUARD_ENROLL_TOKEN_TTL_HOURS:-24}
      WAZUH_MANAGER_URL: ${WAZUH_MANAGER_URL:-}
      WAZUH_MANAGER_USER: ${WAZUH_MANAGER_USER:-}
      WAZUH_MANAGER_PASSWORD: ${WAZUH_MANAGER_PASSWORD:-}
      WAZUH_INDEXER_URL: ${WAZUH_INDEXER_URL:-}
      WAZUH_INDEXER_USER: ${WAZUH_INDEXER_USER:-}
      WAZUH_INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-}
      WAZUH_VERIFY_TLS: ${WAZUH_VERIFY_TLS:-true}
      WAZUH_AGENT_MANAGER_HOST: ${WAZUH_AGENT_MANAGER_HOST:-}
      SIEM_ENABLED: ${SIEM_ENABLED:-false}
      SIEM_SEARCH_MIN_LEVEL: ${SIEM_SEARCH_MIN_LEVEL:-7}
      SIEM_MAX_LOOKBACK_HOURS: ${SIEM_MAX_LOOKBACK_HOURS:-168}
      SIEM_INCLUDE_FULL_LOG: ${SIEM_INCLUDE_FULL_LOG:-false}
      SIEM_MAX_PAGE_SIZE: ${SIEM_MAX_PAGE_SIZE:-50}
      HOST_PROTECT_ENABLED: ${HOST_PROTECT_ENABLED:-true}
      HOST_PROTECT_ALLOW_MOCK: ${HOST_PROTECT_ALLOW_MOCK:-false}
      HOST_PROTECT_ALLOW_LOCAL_WALK: ${HOST_PROTECT_ALLOW_LOCAL_WALK:-false}
      HOST_WAF_ENABLED: ${HOST_WAF_ENABLED:-true}
      UPTIME_ENABLED: ${UPTIME_ENABLED:-true}
      UPTIME_ALLOW_PRIVATE: ${UPTIME_ALLOW_PRIVATE:-false}
      STATUS_PAGE_ENABLED: ${STATUS_PAGE_ENABLED:-true}
      STATUS_PAGE_CNAME_TARGET: ${STATUS_PAGE_CNAME_TARGET:-status-edge.sinexis.app}
      STATUS_PAGE_CF_API_TOKEN: ${STATUS_PAGE_CF_API_TOKEN:-}
      STATUS_PAGE_CF_ZONE_ID: ${STATUS_PAGE_CF_ZONE_ID:-}
      STATUS_PAGE_CF_STUB_ACTIVE: ${STATUS_PAGE_CF_STUB_ACTIVE:-false}
    volumes:
      - scan_data:/tmp/scans
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - vuln-net

  worker_ip:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: vuln-worker-ip
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OSV_BASE_URL: ${OSV_BASE_URL:-https://api.osv.dev/v1}
      NVD_API_KEY: ${NVD_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Sinexis <noreply@sinexis.app>}
      FRONTEND_URL: ${FRONTEND_URL:-https://sinexis.app}
      CELERY_MODE: worker
      CELERY_QUEUE: ip_scan
      CELERY_CONCURRENCY: 2
      HOST_PROTECT_ENABLED: ${HOST_PROTECT_ENABLED:-true}
      HOST_PROTECT_ALLOW_MOCK: ${HOST_PROTECT_ALLOW_MOCK:-false}
      HOST_PROTECT_ALLOW_LOCAL_WALK: ${HOST_PROTECT_ALLOW_LOCAL_WALK:-false}
    volumes:
      - scan_data:/tmp/scans
      # Lab-only local walk (S6). Host dir is empty unless ops plants a fixture.
      # Not a customer docroot. Agent FS (tc5) is not this mount.
      - ${HOST_PROTECT_LAB_BIND:-/var/www/host-protect-fixture}:/var/www/host-protect-fixture:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vuln-net

  worker_domain:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: vuln-worker-domain
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OSV_BASE_URL: ${OSV_BASE_URL:-https://api.osv.dev/v1}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Sinexis <noreply@sinexis.app>}
      FRONTEND_URL: ${FRONTEND_URL:-https://sinexis.app}
      CELERY_MODE: worker
      CELERY_QUEUE: domain_scan
      CELERY_CONCURRENCY: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vuln-net

  worker_mobile:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: vuln-worker-mobile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OSV_BASE_URL: ${OSV_BASE_URL:-https://api.osv.dev/v1}
      CELERY_MODE: worker
      CELERY_QUEUE: mobile_scan
      CELERY_CONCURRENCY: 1
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-local}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_APP_ID: ${COS_APP_ID:-}
      COS_ENDPOINT: ${COS_ENDPOINT:-}
      COS_PREFIX: ${COS_PREFIX:-scans/}
      COS_TIMEOUT_SEC: ${COS_TIMEOUT_SEC:-600}
      BUNDLETOOL_JAVA_TMPDIR: /tmp/scans/bundletool-work
    volumes:
      - scan_data:/tmp/scans
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vuln-net

  worker_uptime:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: vuln-worker-uptime
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      CELERY_MODE: worker
      CELERY_QUEUE: uptime_check
      CELERY_CONCURRENCY: ${UPTIME_WORKER_CONCURRENCY:-8}
      UPTIME_ENABLED: ${UPTIME_ENABLED:-true}
      UPTIME_ALLOW_PRIVATE: ${UPTIME_ALLOW_PRIVATE:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Sinexis <noreply@sinexis.app>}
      FRONTEND_URL: ${FRONTEND_URL:-https://sinexis.app}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vuln-net

  worker_dead_letter:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: vuln-worker-dead-letter
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      CELERY_MODE: worker
      CELERY_QUEUE: dead_letter
      CELERY_CONCURRENCY: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vuln-net

  celery_beat:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: vuln-celery-beat
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      CELERY_MODE: beat
      OSV_BASE_URL: ${OSV_BASE_URL:-https://api.osv.dev/v1}
      UPTIME_ENABLED: ${UPTIME_ENABLED:-true}
      HOST_PROTECT_ENABLED: ${HOST_PROTECT_ENABLED:-true}
      HOST_PROTECT_ALLOW_MOCK: ${HOST_PROTECT_ALLOW_MOCK:-false}
      HOST_PROTECT_ALLOW_LOCAL_WALK: ${HOST_PROTECT_ALLOW_LOCAL_WALK:-false}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.stat('/tmp/celerybeat-schedule')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - vuln-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: vuln-frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
      - /var/cache/nginx:rw,noexec,nosuid,size=128M
      - /var/run:rw,noexec,nosuid,size=16M
      - /var/log/nginx:rw,noexec,nosuid,size=16M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    depends_on:
      - backend
    environment:
      VITE_API_URL: ""
      VITE_WS_URL: ""
      VITE_API_KEY: ${API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:5174:8080"
    networks:
      - vuln-net

volumes:
  postgres_data:
  redis_data:
  scan_data:

networks:
  vuln-net:
    driver: bridge
