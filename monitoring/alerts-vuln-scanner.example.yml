# Example Prometheus rules for VulnScanner auto-fail gauge on /metrics.
# Load via rule_files; route via Alertmanager.

groups:
  - name: vuln-scanner
    rules:
      - alert: VulnScannerAutoFailedJobs
        expr: sum(vuln_maintenance_auto_failed_jobs) > 0
        for: 5m
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "Stale scan jobs were auto-failed"
          description: >-
            vuln_maintenance_auto_failed_jobs is {{ $value }} (pending+running).
            Check celery beat logs, /health/queues auto_failed, and dead_letter depth.
      - alert: VulnScannerAiFxRateStale
        expr: vuln_ai_fx_rate_age_days > 2
        for: 1h
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "AI USD->IDR FX rate is stale"
          description: >-
            vuln_ai_fx_rate_age_days is {{ $value }}. ai_fx.refresh runs daily at
            01:10 UTC on the ip_scan worker. Check its logs and the worker env
            (DB / FX source credentials). The admin FX card offers a manual override
            (Refresh now or a manually entered rate) while the fetch is broken.
      - alert: VulnScannerAiBillingShortfall
        expr: vuln_ai_usage_shortfall_idr_24h > 0
        for: 15m
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "AI billing settled with an uncollected shortfall"
          description: >-
            vuln_ai_usage_shortfall_idr_24h is {{ $value }} IDR. A settle could not
            collect the full amount because the org wallet was exhausted. Inspect the
            wallet balance and the corresponding ai_usage_events.shortfall_idr rows.
      - alert: VulnScannerAiWalletLedgerDrift
        expr: vuln_ai_wallet_ledger_drift_idr > 0
        for: 30m
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "AI wallet balance no longer matches its ledger sum"
          description: >-
            vuln_ai_wallet_ledger_drift_idr is {{ $value }} IDR. A wallet balance no
            longer matches its ledger sum, which means a code path mutated the balance
            without a ledger row (or a manual DB edit). Inspect ai_wallets vs
            ai_wallet_ledger for the offending organization, and never "fix" it by
            editing only one side.
      - alert: VulnScannerAiStaleReservations
        expr: vuln_ai_stale_open_reservations > 0
        for: 15m
        labels:
          severity: warning
          service: vuln-scanner
        annotations:
          summary: "AI reservations are not being reaped"
          description: >-
            vuln_ai_stale_open_reservations is {{ $value }}. ai_reservations.reap
            runs every 5 minutes on the ip_scan queue and releases holds older than
            20 minutes. A sustained count means beat or its worker is not consuming,
            so customer funds stay locked. Check the beat schedule and worker logs,
            then run the task manually if needed.
