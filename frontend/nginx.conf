server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA route /assets collides with Vite hashed files under /assets/.
    # Exact URI must serve the app, not the static directory (403/index).
    location = /assets {
        try_files /index.html =404;
    }

    location = /assets/ {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        # Do not use $uri/ — that matches the /assets/ directory and 403s
        # GET /assets instead of falling through to the SPA.
        try_files $uri /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
