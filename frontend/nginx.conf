server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SEO: only real SPA routes may answer `200 index.html`. Anything else falls
    # through to `location /` and is served the same shell with a 404 status (see
    # error_page below), so crawlers get "not found" while users still see the
    # styled NotFound page instead of nginx's bare 404.
    #
    # SPA-ROUTES-BEGIN — keep in sync with frontend/src/App.tsx.
    # src/test/spaRoutesNginx.test.ts fails CI when a route is added or removed
    # without updating this block. `:param` segments are `[^/]+`; a trailing
    # slash is tolerated because React Router tolerates it too.
    location = / {
        try_files /index.html =404;
    }

    # SPA route /assets collides with Vite hashed files under /assets/.
    # Exact URI must serve the app, not the static directory (403/index).
    location = /assets {
        try_files /index.html =404;
    }

    location = /assets/ {
        try_files /index.html =404;
    }

    location ~ "^/(?:admin(?:/(?:ai|blog|email-logs|hpp|invoices|promo-codes|simulator|skus|subscription-requests|subscriptions|users(?:/[^/]+)?))?|ai|credit-history|dashboard|forgot-password|guard|guide|host|inbox|login|org/members|pay/[^/]+|products|profile|register|reset-password|scan/[^/]+|schedules|settings/(?:subscription|workspace)|siem|uptime(?:/[^/]+)?|verify-email)/?$" {
        try_files /index.html =404;
    }
    # SPA-ROUTES-END

    # PRODUCT-SLUGS-BEGIN — published slugs only. `/products/<unknown>` must 404
    # (soft 404 otherwise). This list is the third copy of the registry, so
    # scripts/check-public-registry-sync.mjs and src/test/spaRoutesNginx.test.ts
    # both fail when it drifts from frontend/src/lib/services.ts.
    location ~ "^/products/(scan|guard|host|uptime|ai-gateway)/?$" {
        try_files /index.html =404;
    }
    # PRODUCT-SLUGS-END

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        # Do not use $uri/ — that matches the /assets/ directory and 403s
        # GET /assets instead of falling through to the SPA.
        try_files $uri =404;
    }

    # Unknown SPA URL: keep HTTP 404 (SEO) while rendering the app shell so the
    # client-side NotFound route is shown instead of a bare nginx error page.
    error_page 404 /index.html;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
